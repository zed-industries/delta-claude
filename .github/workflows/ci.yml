name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate and test (Claude Code ${{ matrix.claude-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        claude-version: ["2.1.300", "latest"]
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code
        run: |
          npm install --global @anthropic-ai/claude-code@${{ matrix.claude-version }}
          claude --version
      - name: Validate plugin
        run: |
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json
      - name: Run plugin tests
        run: claude plugin test .
      - name: Check CLI setup
        run: python3 scripts/check-cli-setup.py

  # The one check `main` requires, so the matrix can change without touching the rule. See
  # `.agents/skills/land/SKILL.md`.
  ci_pass:
    name: CI Pass
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Check the tests passed
        run: test "${{ needs.test.result }}" = success
      # This job's own check run satisfies a pull request. A direct push to `main` is checked
      # against the commit's status rollup, which counts commit statuses but not necessarily the
      # check runs of a branch push, so publish one. Pull requests from forks get a read-only token
      # and never need it.
      - name: Publish the status for direct pushes
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f context="CI Pass" \
            -f state=success \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Validation and tests passed"
